openapi: 3.0.3
info:
  title: CAB System - Report API
  version: 1.0.0
paths:
  /reports/dashboard:
    get:
      summary: Báo cáo số lượng chuyến, doanh thu, tỷ lệ hoàn thành (FR10.1, FR10.2, FR10.3)
      security:
        - BearerAuth: []
      parameters:
        - name: from_date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-01" }
        - name: to_date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-30" }
      responses:
        '200':
          description: Dữ liệu thống kê tổng hợp
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_trips: { type: integer, example: 1500 }
                  completed_trips: { type: integer, example: 1420 }
                  total_revenue: { type: number, example: 120500000 }
                  completion_rate: { type: string, example: "94.6%" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
