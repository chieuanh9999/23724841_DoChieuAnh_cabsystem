openapi: 3.0.3
info:
  title: CAB System - Payment API
  version: 1.0.0
paths:
  /payments/fare:
    get:
      summary: Tính cước chuyến đi (FR4.1)
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trả về số tiền cước
  /payments/checkout:
    post:
      summary: Thanh toán chuyến đi (FR4.2 -> FR4.5)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Xử lý thanh toán thành công hoặc URL cổng thanh toán
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
