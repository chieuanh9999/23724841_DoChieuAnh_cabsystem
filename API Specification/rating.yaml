openapi: 3.0.3
info:
  title: CAB System - Rating API
  version: 1.0.0
paths:
  /ratings:
    post:
      summary: Khách hàng đánh giá tài xế (FR8.1, FR8.2)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trip_id, score]
              properties:
                trip_id: { type: string, example: "trip-999" }
                score: { type: integer, minimum: 1, maximum: 5, example: 5 }
                comment: { type: string, example: "Tài xế chạy êm, nhiệt tình!" }
      responses:
        '201':
          description: Đã lưu đánh giá
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
